<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTTP/1.0 Server Web Application</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 30px;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 20px;
        }

        .config-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
            font-size: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            font-family: 'Courier New', monospace;
            resize: vertical;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
            margin-bottom: 20px;
        }

        .tab {
            padding: 15px 25px;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
        }

        .tab:hover {
            color: #667eea;
        }

        .tab.active {
            color: #667eea;
            border-bottom: 3px solid #667eea;
            margin-bottom: -2px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-get { background: #10b981; }
        .btn-get:hover:not(:disabled) { background: #059669; }

        .btn-head { background: #3b82f6; }
        .btn-head:hover:not(:disabled) { background: #2563eb; }

        .btn-post { background: #8b5cf6; }
        .btn-post:hover:not(:disabled) { background: #7c3aed; }

        .btn-put { background: #f59e0b; }
        .btn-put:hover:not(:disabled) { background: #d97706; }

        .btn-dos { background: #ef4444; }
        .btn-dos:hover:not(:disabled) { background: #dc2626; }

        .response-box {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 5px;
            padding: 15px;
            margin-top: 20px;
        }

        .response-box h3 {
            margin-bottom: 10px;
            color: #374151;
            font-size: 14px;
        }

        .response-box pre {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #1f2937;
        }

        .warning-box {
            background: #fef3c7;
            border: 2px solid #fcd34d;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
            color: #92400e;
        }

        .warning-box strong {
            display: block;
            margin-bottom: 5px;
        }

        .success-box {
            background: #d1fae5;
            border: 2px solid #6ee7b7;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
            color: #065f46;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th {
            background: #f3f4f6;
            padding: 12px;
            text-align: left;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            border-bottom: 2px solid #e5e7eb;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
        }

        tr:hover {
            background: #f9fafb;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            background: #ddd6fe;
            color: #5b21b6;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        code {
            background: #e0e7ff;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }

        .status-200 { color: #10b981; }
        .status-400 { color: #f59e0b; }
        .status-500 { color: #ef4444; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>HTTP/1.0 Server Web Application</h1>

            <div class="config-grid">
                <div>
                    <label>Server Host</label>
                    <input type="text" id="serverHost" value="localhost">
                </div>
                <div>
                    <label>Server Port</label>
                    <input type="text" id="serverPort" value="8080">
                </div>
            </div>
        </div>

        <div class="card">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('operations')">File Operations</button>
                <button class="tab" onclick="switchTab('dos')">DoS Testing</button>
                <button class="tab" onclick="switchTab('visitors')">Visitors</button>
            </div>

            <div id="operations" class="tab-content active">
                <h2 style="margin-bottom: 20px;">HTTP Methods</h2>

                <div style="margin-bottom: 15px;">
                    <label>Filename (path)</label>
                    <input type="text" id="filename" placeholder="test.txt" value="test.txt">
                </div>

                <div style="margin-bottom: 15px;">
                    <label>File Content (for POST/PUT)</label>
                    <textarea id="fileContent" rows="5" placeholder="Enter file content here...">Hello from the web interface!</textarea>
                </div>

                <div class="button-grid">
                    <button class="btn-get" onclick="sendRequest('GET')">GET</button>
                    <button class="btn-head" onclick="sendRequest('HEAD')">HEAD</button>
                    <button class="btn-post" onclick="sendRequest('POST')">POST</button>
                    <button class="btn-put" onclick="sendRequest('PUT')">PUT</button>
                </div>

                <div id="operationsResponse"></div>
            </div>

            <div id="dos" class="tab-content">
                <h2 style="margin-bottom: 20px;">DoS Protection Testing</h2>

                <div class="warning-box">
                    <strong>Warning:</strong>
                    This will send multiple rapid requests to test the server's DoS protection (100 requests/60 seconds threshold).
                    Your IP may be temporarily banned!
                </div>

                <div style="margin-bottom: 15px;">
                    <label>Filename to Request</label>
                    <input type="text" id="dosFilename" placeholder="test.txt" value="test.txt">
                </div>

                <div style="margin-bottom: 15px;">
                    <label>Number of Requests</label>
                    <input type="number" id="dosCount" value="150" min="1" max="500">
                </div>

                <button class="btn-dos" onclick="dosTest()" style="width: 100%; margin-bottom: 20px;">Start DoS Test</button>

                <div id="dosResponse"></div>
            </div>

            <div id="visitors" class="tab-content">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2>Visitor Tracking</h2>
                </div>

                <div id="visitorsTable"></div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });

            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            if (tabName === 'visitors') {
                loadVisitors();
            }
        }

        async function sendRequest(method) {
            const host = document.getElementById('serverHost').value;
            const port = document.getElementById('serverPort').value;
            const filename = document.getElementById('filename').value;
            const fileContent = document.getElementById('fileContent').value;
            const responseDiv = document.getElementById('operationsResponse');

            if (!filename) {
                showResponse(responseDiv, 'Error: Please enter a filename', 'error');
                return;
            }

            // For GET, use the special /download/ endpoint to save to server's Download/ folder
            let url = `http://${host}:${port}/${filename}`;
            let actualMethod = method;

            if (method === 'GET') {
                url = `http://${host}:${port}/download/${filename}`;
                actualMethod = 'POST'; // Use POST to trigger server-side download
                showResponse(responseDiv, `Downloading ${filename} to server's Download/ folder...`, 'loading');
            } else {
                showResponse(responseDiv, `Sending ${method} request to /${filename}...`, 'loading');
            }

            try {
                const options = {
                    method: actualMethod,
                    mode: 'cors',
                    credentials: 'include',
                };

                if ((actualMethod === 'POST' || actualMethod === 'PUT') && method !== 'GET') {
                    if (!fileContent) {
                        showResponse(responseDiv, `Error: Please enter file content for ${method}`, 'error');
                        return;
                    }
                    options.headers = {
                        'Content-Type': 'application/octet-stream',
                    };
                    options.body = fileContent;
                }

                const response = await fetch(url, options);

                let data;
                try {
                    data = await response.text();
                } catch (e) {
                    data = '(Unable to read response body)';
                }

                let statusClass = 'status-200';
                if (response.status >= 400 && response.status < 500) statusClass = 'status-400';
                if (response.status >= 500) statusClass = 'status-500';

                let headersText = '';
                response.headers.forEach((value, key) => {
                    headersText += `${key}: ${value}\n`;
                });

                const output = `<span class="${statusClass}"><strong>Status:</strong> ${response.status} ${response.statusText}</span>\n\n` +
                               `<strong>Headers:</strong>\n${headersText}\n` +
                               `<strong>Body:</strong>\n${data || '(empty)'}`;

                const setCookie = response.headers.get('set-cookie');
                let cookieInfo = '';
                if (setCookie) {
                    const visitMatch = setCookie.match(/visit_count=(\d+)/);
                    const ipMatch = setCookie.match(/visitor_id=([^;]+)/);
                    if (visitMatch || ipMatch) {
                        cookieInfo = `\n\n<strong>Visitor Info:</strong>\n`;
                        if (ipMatch) cookieInfo += `IP: ${ipMatch[1]}\n`;
                        if (visitMatch) cookieInfo += `Visit Count: ${visitMatch[1]}`;
                    }
                }

                showResponse(responseDiv, output + cookieInfo, response.ok ? 'success' : 'error');

            } catch (error) {
                showResponse(responseDiv,
                    `<strong>Error:</strong> ${error.message}\n\n` +
                    `Make sure:\n` +
                    `• The server is running on ${host}:${port}\n` +
                    `• CORS is enabled (it should be by default)\n` +
                    `• The file exists (for GET/HEAD requests)`,
                    'error');
            }
        }

        async function dosTest() {
            const host = document.getElementById('serverHost').value;
            const port = document.getElementById('serverPort').value;
            const filename = document.getElementById('dosFilename').value;
            const count = parseInt(document.getElementById('dosCount').value);
            const responseDiv = document.getElementById('dosResponse');

            if (!filename) {
                showResponse(responseDiv, 'Error: Please enter a filename', 'error');
                return;
            }

            const button = event.target;
            button.disabled = true;
            button.textContent = 'Testing in progress...';

            showResponse(responseDiv, `Starting DoS test with ${count} requests...\n`, 'loading');

            let successCount = 0;
            let bannedCount = 0;
            let errorCount = 0;
            const startTime = Date.now();
            let isBanned = false;

            for (let i = 0; i < count; i++) {
                try {
                    const url = `http://${host}:${port}/${filename}`;
                    const response = await fetch(url, { mode: 'cors' });

                    if (response.status === 200) {
                        successCount++;
                    } else if (response.status === 429) {
                        bannedCount++;
                        isBanned = true;
                        appendResponse(responseDiv, `\nRequest ${i + 1}: BANNED! (429 Too Many Requests)`);
                        appendResponse(responseDiv, `\nDoS protection triggered. Stopping test.`);
                        break;
                    } else {
                        errorCount++;
                    }

                    if (i % 10 === 0 || i === count - 1) {
                        appendResponse(responseDiv, `\nRequest ${i + 1}/${count}: ${response.status}`);
                    }
                } catch (error) {
                    errorCount++;
                    if (i % 10 === 0) {
                        appendResponse(responseDiv, `\nRequest ${i + 1}: ${error.message}`);
                    }
                }

                if (i % 50 === 0) {
                    await new Promise(resolve => setTimeout(resolve, 10));
                }
            }

            const elapsed = (Date.now() - startTime) / 1000;
            const results = `\n\n${'='.repeat(40)}\n` +
                          `<strong>DoS Test Results</strong>\n` +
                          `${'='.repeat(40)}\n` +
                          `Total Requests: ${successCount + bannedCount + errorCount}\n` +
                          `Successful: ${successCount}\n` +
                          `Banned: ${isBanned ? 'YES (after ' + (successCount + bannedCount) + ' requests)' : 'NO'}\n` +
                          `Errors: ${errorCount}\n` +
                          `Time: ${elapsed.toFixed(2)} seconds\n` +
                          `Rate: ${((successCount + bannedCount + errorCount) / elapsed).toFixed(2)} req/s\n` +
                          `${'='.repeat(40)}`;

            appendResponse(responseDiv, results);

            button.disabled = false;
            button.textContent = 'Start DoS Test';
        }

        async function loadVisitors() {
            const host = document.getElementById('serverHost').value;
            const port = document.getElementById('serverPort').value;
            const tableDiv = document.getElementById('visitorsTable');

            tableDiv.innerHTML = '<div class="empty-state">Loading visitors...</div>';

            try {
                const response = await fetch(`http://${host}:${port}/visitors.json`, {
                    mode: 'cors'
                });

                if (!response.ok) {
                    tableDiv.innerHTML = '<div class="empty-state">No visitor data available<br><small>Make some requests first or check if visitors.json exists in Upload/</small></div>';
                    return;
                }

                const visitors = await response.json();

                if (Object.keys(visitors).length === 0) {
                    tableDiv.innerHTML = '<div class="empty-state">No visitors yet</div>';
                    return;
                }

                let html = '<table><thead><tr><th>IP Address</th><th>Visit Count</th><th>First Visit</th><th>Last Visit</th></tr></thead><tbody>';

                const sortedVisitors = Object.entries(visitors).sort((a, b) => b[1].count - a[1].count);

                for (const [ip, data] of sortedVisitors) {
                    html += `<tr>
                        <td><code>${ip}</code></td>
                        <td><span class="badge">${data.count} visit${data.count > 1 ? 's' : ''}</span></td>
                        <td>${data.first_visit}</td>
                        <td>${data.last_visit}</td>
                    </tr>`;
                }

                html += '</tbody></table>';
                html += `<div style="margin-top: 15px; color: #666; font-size: 14px;">Total unique visitors: ${sortedVisitors.length}</div>`;
                tableDiv.innerHTML = html;

            } catch (error) {
                tableDiv.innerHTML = `<div class="empty-state">Error loading visitors: ${error.message}<br><small>Make sure the server is running and visitors.json is in the Upload/ directory</small></div>`;
            }
        }

        function showResponse(element, text, type = 'info') {
            let className = 'response-box';
            let icon = 'Info';

            if (type === 'success') {
                className += ' success-box';
                icon = 'Success';
            } else if (type === 'error') {
                className += ' warning-box';
                icon = 'Error';
            } else if (type === 'loading') {
                icon = 'Loading';
            }

            element.innerHTML = `<div class="${className}"><h3>${icon}:</h3><pre>${text}</pre></div>`;
        }

        function appendResponse(element, text) {
            const pre = element.querySelector('pre');
            if (pre) {
                pre.innerHTML += text;
                // Auto-scroll to bottom
                pre.scrollTop = pre.scrollHeight;
            } else {
                showResponse(element, text);
            }
        }

        window.addEventListener('load', () => {
            console.log('HTTP Server Web App loaded');
            console.log('Make sure your server.py is running!');
        });
    </script>
</body>
</html>
